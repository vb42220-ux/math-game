<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>湊十進一｜加法點數遊戲</title>
<style>
:root{font-family:system-ui,"Noto Sans TC",sans-serif;color:#19334a;background:#f1f8ff}*{box-sizing:border-box}
body{margin:0;padding:18px}main{max-width:860px;margin:auto}
h1{font-size:clamp(1.7rem,5vw,2.5rem);margin:.2em 0}p{margin:.35em 0}
.top,.card{background:white;border:2px solid #c9deef;border-radius:24px;padding:clamp(16px,3vw,28px);margin-bottom:16px;box-shadow:0 5px 0 #d9eaf6}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.meta{font-weight:800;font-size:1.1rem}
.equation{text-align:center;font-size:clamp(2.4rem,10vw,4.6rem);font-weight:900;letter-spacing:.03em;margin:4px 0 18px}
.step{font-size:1.25rem;font-weight:850;margin:12px 0}.muted{color:#48677e}
.place{max-width:570px;margin:0 auto 18px;display:grid;grid-template-columns:1fr 1fr;border:3px solid #4279ad;border-radius:16px;overflow:hidden;text-align:center;font-weight:900}
.place>div{padding:8px;border:1px solid #a9cbe3}.place .label{background:#dfedff;font-size:1.25rem}.place .digit{font-size:2.8rem}.carry{background:#fff1b8;color:#795000;font-size:1.1rem}
.dots{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:center;min-height:88px}.group{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:360px;padding:13px;border:3px solid #6aa4df;border-radius:18px;background:#eef7ff}.group.new{border-color:#ee9c45;background:#fff4e6}.dot{width:clamp(27px,7vw,43px);height:clamp(27px,7vw,43px);border-radius:50%;background:#327ed1;border:3px solid #1d5c9e}.new .dot{background:#f19737;border-color:#b96a16}.ten{background:#e1f7e8;border-color:#38a267}.ten .dot{background:#238e5d;border-color:#187047}
.sign{font-size:2.1rem;font-weight:900}.hintbox{min-height:92px;border:2px dashed #a2bfd5;border-radius:16px;padding:14px;margin:15px 0;text-align:center;font-size:clamp(1.1rem,4vw,1.55rem);font-weight:800}.hintbox strong{color:#156b46}
.controls,.choices{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}button{font:inherit;font-weight:900;border:3px solid #22547c;border-radius:18px;background:#e7f2ff;color:#173e5e;min-width:150px;min-height:70px;padding:10px 18px;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:5px solid #e88a00;outline-offset:3px}button:hover{filter:brightness(.96)}button:disabled{opacity:.55;cursor:default}.primary{background:#166ab4;color:white;border-color:#14558f}.choices button{min-width:clamp(130px,38vw,240px);min-height:100px;font-size:2.8rem;background:#fff}.choices button.correct{background:#dcf5df;border-color:#278448}.choices button.wrong{background:#ffe5e5;border-color:#bb4b4b}.feedback{text-align:center;font-size:1.35rem;font-weight:900;min-height:58px;margin:12px 0}.footer{text-align:center;color:#466174;font-size:.95rem}
@media(max-width:540px){body{padding:10px}.top,.card{border-radius:18px}.group{max-width:46%;gap:4px;padding:7px}.dot{border-width:2px}.controls button{flex:1;min-width:130px}}
</style>
</head>
<body>
<main>
<header class="top"><div><h1>🔟 湊十進一</h1><p class="muted">二位數 ＋ 一位數｜看點數學進位</p></div><div class="meta">第 <span id="number">1</span>／10 題　⭐ <span id="score">0</span></div></header>
<section class="card" aria-label="進位加法遊戲">
<div id="equation" class="equation"></div>
<div class="place" aria-label="十位個位定位板">
 <div class="label">十位</div><div class="label">個位</div>
 <div id="carryCell" class="carry">進位：待觀察</div><div class="carry">先算個位 ↓</div>
 <div id="tens" class="digit"></div><div id="ones" class="digit"></div>
 <div class="digit">＋</div><div id="add" class="digit"></div>
</div>
<div class="step" id="step">① 看一看：個位有幾個點？</div>
<div class="dots" id="dots" aria-label="個位點數"></div>
<div class="hintbox" id="hint" aria-live="polite">藍色是原本的個位，橘色是加上的點。</div>
<div class="controls"><button id="help" type="button">💡 幫幫我：湊 10</button><button id="speak" type="button">🔊 聽題目</button></div>
<div class="step" style="text-align:center">② 選答案</div>
<div class="choices" id="choices"></div>
<div class="feedback" id="feedback" role="status" aria-live="polite"></div>
<div class="controls"><button class="primary" id="next" type="button" hidden>下一題 ➜</button></div>
</section>
<p class="footer">可以用滑鼠、觸控或鍵盤操作。語音需裝置支援中文朗讀。</p>
</main>
<script>
(() => {
 const $=id=>document.getElementById(id);
 const elements={number:$('number'),score:$('score'),equation:$('equation'),carry:$('carryCell'),tens:$('tens'),ones:$('ones'),add:$('add'),step:$('step'),dots:$('dots'),hint:$('hint'),help:$('help'),choices:$('choices'),feedback:$('feedback'),next:$('next')};
 let q=0,score=0,question,shown=false,answered=false,deck=[];
 function voice(message){if(!('speechSynthesis' in window))return; speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(message);u.lang='zh-TW';u.rate=.78;speechSynthesis.speak(u)}
 function sample(){const b=10+Math.floor(Math.random()*79),ones=b%10,a=10-ones+Math.floor(Math.random()*ones);return {b,a,answer:b+a}}
 function makeDeck(){let arr=[];while(arr.length<10){const x=sample();if(x.a>=1&&x.a<=9&&x.answer<=99&&!arr.some(y=>y.b===x.b&&y.a===x.a))arr.push(x)}return arr}
 function dotGroup(n,kind,title){const group=document.createElement('div');group.className='group '+kind;group.setAttribute('aria-label',title);for(let i=0;i<n;i++){const dot=document.createElement('span');dot.className='dot';dot.setAttribute('aria-hidden','true');group.append(dot)}return group}
 function drawInitial(){elements.dots.replaceChildren(dotGroup(question.b%10,'',`原本 ${question.b%10} 個點`),Object.assign(document.createElement('span'),{className:'sign',textContent:'＋'}),dotGroup(question.a,'new',`再加 ${question.a} 個點`))}
 function reveal(){if(answered)return;shown=true;const o=question.b%10,remain=o+question.a-10;elements.dots.replaceChildren(dotGroup(10,'ten','十個點，合成一個十'));if(remain){elements.dots.append(Object.assign(document.createElement('span'),{className:'sign',textContent:'＋'}),dotGroup(remain,'new',`剩下 ${remain} 個點`))}
 elements.carry.textContent='進位：＋1 個十';elements.step.textContent='① 湊成一組 10，進 1 到十位';elements.hint.innerHTML=`${o} ＋ ${question.a} ＝ 10 ＋ ${remain}<br><strong>10 個一 → 1 個十</strong>，十位 ${Math.floor(question.b/10)} ＋ 1 ＝ ${Math.floor(question.b/10)+1}`;elements.help.disabled=true}
 function options(){let wrong=question.answer+(Math.random()<.5?-10:10);if(wrong<10||wrong>99||wrong===question.answer)wrong=question.answer+(question.answer<90?1:-1);return Math.random()<.5?[question.answer,wrong]:[wrong,question.answer]}
 function render(){question=deck[q];shown=false;answered=false;elements.number.textContent=q+1;elements.equation.textContent=`${question.b} ＋ ${question.a} ＝ ？`;elements.tens.textContent=Math.floor(question.b/10);elements.ones.textContent=question.b%10;elements.add.textContent=question.a;elements.carry.textContent='進位：待觀察';elements.step.textContent='① 看一看：個位有幾個點？';elements.hint.textContent='藍色是原本的個位，橘色是加上的點。';elements.help.disabled=false;elements.feedback.textContent='';elements.next.hidden=true;drawInitial();elements.choices.replaceChildren();for(const n of options()){const button=document.createElement('button');button.type='button';button.textContent=n;button.setAttribute('aria-label',`答案 ${n}`);button.addEventListener('click',()=>choose(n,button));elements.choices.append(button)}}
 function choose(n,button){if(answered)return;if(n!==question.answer){button.classList.add('wrong');elements.feedback.textContent='再試一次，按「幫幫我」看湊 10。';reveal();voice('再試一次，看看湊十的提示');return}answered=true;score++;elements.score.textContent=score;button.classList.add('correct');elements.choices.querySelectorAll('button').forEach(b=>b.disabled=true);elements.feedback.textContent='🎉 答對了！';elements.next.hidden=false;elements.next.textContent=q===9?'看結果 ➜':'下一題 ➜';voice('答對了')}
 function finish(){elements.equation.textContent='🎉 完成！';elements.step.textContent='你完成 10 題練習';elements.dots.replaceChildren();elements.hint.textContent=`答對 ${score} 題！可以再玩一次。`;elements.choices.replaceChildren();elements.feedback.textContent='做得很好！';elements.next.textContent='再玩一次 ↻';elements.next.hidden=false;elements.next.focus()}
 elements.help.addEventListener('click',reveal);$('speak').addEventListener('click',()=>{if(q<10)voice(`${question.b} 加 ${question.a} 等於多少？先看個位點數。`)});elements.next.addEventListener('click',()=>{if(q===10||q===9&&answered&&elements.next.textContent==='再玩一次 ↻'){q=0;score=0;elements.score.textContent='0';deck=makeDeck();render();return}q++;if(q===10)finish();else render()});
 deck=makeDeck();render();
})();
</script>
</body>
</html>
