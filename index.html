<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>滿10進1！進位加法小遊戲</title>
<style>
body{font-family:Arial,"Noto Sans TC",sans-serif;background:#f6f7fb;margin:0;color:#222}.wrap{max-width:720px;margin:auto;padding:18px}.card{background:white;border:2px solid #ddd;border-radius:20px;padding:20px}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.badge{padding:8px 12px;border:2px solid #ddd;border-radius:999px;font-weight:bold}.tools{text-align:center;margin:16px}.btn{font-size:18px;min-height:50px;padding:10px 18px;margin:4px;border:0;border-radius:14px;background:#e9eefb;font-weight:bold;cursor:pointer}.board{max-width:380px;margin:auto;border:3px solid #555;border-radius:14px;overflow:hidden}.row{display:grid;grid-template-columns:1fr 1fr;text-align:center}.cell{padding:12px;border-bottom:2px solid #777;font-size:36px;font-weight:bold}.cell:first-child{border-right:2px solid #777}.head .cell{font-size:20px;background:#f2f2f2}.equation{text-align:center;font-size:36px;font-weight:bold;margin:20px}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.answer{font-size:30px;min-height:75px;border:3px solid #bbb;border-radius:16px;background:white;font-weight:bold;cursor:pointer}.answer:disabled{opacity:.45}.feedback{text-align:center;min-height:42px;font-size:24px;font-weight:bold;margin:16px}.hint{display:none;text-align:center;background:#fff5cf;border-radius:14px;padding:14px;margin:12px 0;font-size:20px;line-height:1.7}.next{display:none;margin:12px auto;background:#dce9ff}.rule{margin-top:15px;background:#eef7ee;border-radius:14px;padding:14px;line-height:1.7}@media(min-width:600px){.answers{grid-template-columns:repeat(4,1fr)}}
</style>
</head><body><main class="wrap"><h1>🎯 滿10進1！進位加法</h1><p>一位數＋二位數｜一次進位</p><div class="top"><span class="badge">⭐ 得分 <span id="score">0</span></span><span class="badge">第 <span id="qnum">1</span> / 10 題</span></div><div class="card"><div class="tools"><button class="btn" id="speak">🔊 聽題目</button><button class="btn" id="hintBtn">💡 看提示</button></div><div class="board"><div class="row head"><div class="cell">十位</div><div class="cell">個位</div></div><div class="row"><div class="cell" id="tens"></div><div class="cell" id="ones"></div></div><div class="row"><div class="cell">＋</div><div class="cell" id="add"></div></div></div><div class="hint" id="hint"></div><div class="equation" id="equation"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback" aria-live="polite"></div><button class="btn next" id="next">下一題 ➜</button></div><div class="rule"><b>老師口訣：</b>① 個位先相加　② 滿 10，進 1　③ 再算十位</div></main>
<script>
const $=s=>document.querySelector(s);let score=0,q=1,current,locked=false;
function makeQ(){let a,b;do{b=10+Math.floor(Math.random()*80);a=1+Math.floor(Math.random()*9)}while(b%10+a<10||b+a>99);return{a,b,ans:a+b}}
function options(ans){let s=new Set([ans]);while(s.size<4){let ds=[-10,-2,-1,1,2,10],x=ans+ds[Math.floor(Math.random()*ds.length)];if(x>9&&x<100)s.add(x)}return[...s].sort(()=>Math.random()-.5)}
function speak(t){if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='zh-TW';u.rate=.78;speechSynthesis.speak(u)}}
function render(){current=makeQ();locked=false;$('#qnum').textContent=q;$('#tens').textContent=Math.floor(current.b/10);$('#ones').textContent=current.b%10;$('#add').textContent=current.a;$('#equation').textContent=`${current.b} ＋ ${current.a} ＝ ?`;$('#feedback').textContent='';$('#hint').style.display='none';$('#next').style.display='none';$('#answers').innerHTML='';options(current.ans).forEach(v=>{let b=document.createElement('button');b.className='answer';b.textContent=v;b.onclick=()=>check(v,b);$('#answers').appendChild(b)})}
function check(v,b){if(locked)return;if(v===current.ans){locked=true;score++;$('#score').textContent=score;$('#feedback').textContent='🎉 答對了！好棒！';b.style.background='#dff5df';$('#next').style.display='block';speak('答對了，好棒！')}else{$('#feedback').textContent='再想一想！先算個位。';b.disabled=true;speak('再想一想，先算個位。')}}
$('#hintBtn').onclick=()=>{let o=current.b%10,s=o+current.a;$('#hint').innerHTML=`👆 個位先算：<b>${o} ＋ ${current.a} ＝ ${s}</b><br>🎒 ${s} ＝ 10 ＋ ${s-10}<br>所以把 <b>1 個十</b> 進到十位！`;$('#hint').style.display='block'};
$('#speak').onclick=()=>speak(`${current.b} 加 ${current.a} 等於多少？`);
$('#next').onclick=()=>{if(q===10){$('#feedback').textContent=`🏆 完成！你答對 ${score} 題！`;$('#answers').innerHTML='';$('#next').textContent='再玩一次 ↻';$('#next').onclick=()=>location.reload();return}q++;render()};render();
</script></body></html>
